# Backend Production Readiness — Sprint 4, Story 4.3 (audit gap #13).
# Dependency/CVE scanning for the Medusa backend. GitHub-native, no build gate:
# Dependabot raises weekly dependency PRs and security PRs for known CVEs, so a
# vulnerable package is surfaced as a reviewable PR instead of shipping silently.
# (Chosen over a build-failing npm-audit/Trivy step so a transitive advisory never
# blocks an unrelated deploy — see the epic plan.)
version: 2
updates:
  # Medusa app dependencies (package.json at repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Collapse the routine churn into one PR; security updates still come separately.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # react-i18next >=17 requires i18next >=26.2.0 (its own peerDependencies), but @medusajs/dashboard
      # — the admin UI bundled INTO this backend's own build ("Compiling frontend source") — hard-pins
      # react-i18next to 13.5.0 + i18next to 23.7.11 as ITS OWN direct dependencies, even at the latest
      # stable @medusajs/dashboard (2.17.2, checked 2026-07-03). Bumping react-i18next here alone breaks
      # the admin build (`"keyFromSelector" is not exported by i18next`, confirmed live — PR #23).
      # Un-ignore once @medusajs/dashboard itself moves off react-i18next 13.5.0/i18next 23.7.11.
      - dependency-name: "react-i18next"
        versions: [">=14.0.0"]

      # The React runtime and router are pinned BY @medusajs/dashboard — the admin UI bundled into this
      # backend's own build — not by us. Every Medusa admin package peer-requires react/react-dom
      # `^18.3.1` (@medusajs/dashboard, @medusajs/draft-order, @medusajs/medusa, @medusajs/ui, checked
      # 2026-08-24), so a root-only React major is not an upgrade, it is a broken install:
      # PR #140 bumped react-dom to 19.2.8 while leaving react at 18.3.1, and react-dom@19 declares
      # `peerDependencies: { react: "^19.2.8" }`. Its OWN lockfile resolved that violated pair — and CI
      # went GREEN, because tsc + build never exercise the admin at runtime. That is the whole reason
      # these are ignored rather than left to the gate: the gate cannot see this class of break.
      #
      # Same story for the router: the root pins react-router-dom to an EXACT 6.30.3 (no caret) to sit
      # alongside the 6.30.4 @medusajs/dashboard and @medusajs/draft-order depend on. Bumping the root
      # to 7.x leaves two routers in the tree with two separate contexts.
      #
      # Only MAJORS are ignored. A react 18.3.x patch — including a security fix — still comes through,
      # which is the point: banning the whole dependency to avoid one bad bump would cost more than it
      # saves. Un-ignore each of these once @medusajs/dashboard itself moves.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]

  # Keep the CI/CD GitHub Actions (notify-telegram.yml) patched too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
