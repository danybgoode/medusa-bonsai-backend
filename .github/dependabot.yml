# Backend Production Readiness — Sprint 4, Story 4.3 (audit gap #13).
# Dependency/CVE scanning for the Medusa backend. GitHub-native, no build gate:
# Dependabot raises weekly dependency PRs and security PRs for known CVEs, so a
# vulnerable package is surfaced as a reviewable PR instead of shipping silently.
# (Chosen over a build-failing npm-audit/Trivy step so a transitive advisory never
# blocks an unrelated deploy — see the epic plan.)
version: 2
updates:
  # Medusa app dependencies (package.json at repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The Medusa framework is NOT routine churn and must never ride in the group below.
      #
      # Medusa versions the whole engine on 2.x, so a framework upgrade arrives as a "minor" — and on
      # 2026-08-25 the minor-and-patch group quietly carried **68 @medusajs packages from 2.17.2 to
      # 2.19.0**: the commerce engine, the admin bundler, auth, cache, payment and order modules, in a
      # PR titled "bump the minor-and-patch group with 25 updates". Auto-merge had already queued it;
      # the only thing that stopped it was an unrelated test failing, because 2.19.0 had removed an
      # internal API. A green run would have deployed a two-minor engine upgrade to production
      # unattended.
      #
      # Grouping them separately makes the upgrade legible and reviewable as one thing. The
      # auto-merge workflow additionally refuses this group outright — a commerce engine carrying the
      # money path gets a person, a changelog and a smoke, never a green check alone.
      medusa-framework:
        patterns:
          - "@medusajs/*"
        update-types:
          - "minor"
          - "patch"

      # Collapse the genuinely routine churn into one PR; security updates still come separately.
      minor-and-patch:
        exclude-patterns:
          - "@medusajs/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # react-i18next >=17 requires i18next >=26.2.0 (its own peerDependencies), but @medusajs/dashboard
      # — the admin UI bundled INTO this backend's own build ("Compiling frontend source") — hard-pins
      # react-i18next to 13.5.0 + i18next to 23.7.11 as ITS OWN direct dependencies, even at the latest
      # stable @medusajs/dashboard (2.17.2, checked 2026-07-03). Bumping react-i18next here alone breaks
      # the admin build (`"keyFromSelector" is not exported by i18next`, confirmed live — PR #23).
      # Un-ignore once @medusajs/dashboard itself moves off react-i18next 13.5.0/i18next 23.7.11.
      - dependency-name: "react-i18next"
        versions: [">=14.0.0"]

      # The React runtime and router are pinned BY @medusajs/dashboard — the admin UI bundled into this
      # backend's own build — not by us. Every Medusa admin package peer-requires react/react-dom
      # `^18.3.1` (@medusajs/dashboard, @medusajs/draft-order, @medusajs/medusa, @medusajs/ui, checked
      # 2026-08-24), so a root-only React major is not an upgrade, it is a broken install:
      # PR #140 bumped react-dom to 19.2.8 while leaving react at 18.3.1, and react-dom@19 declares
      # `peerDependencies: { react: "^19.2.8" }`. Its OWN lockfile resolved that violated pair — and CI
      # went GREEN, because tsc + build never exercise the admin at runtime. That is the whole reason
      # these are ignored rather than left to the gate: the gate cannot see this class of break.
      #
      # Same story for the router: the root pins react-router-dom to an EXACT 6.30.3 (no caret) to sit
      # alongside the 6.30.4 @medusajs/dashboard and @medusajs/draft-order depend on. Bumping the root
      # to 7.x leaves two routers in the tree with two separate contexts.
      #
      # Only MAJORS are ignored. A react 18.3.x patch — including a security fix — still comes through,
      # which is the point: banning the whole dependency to avoid one bad bump would cost more than it
      # saves. Un-ignore each of these once @medusajs/dashboard itself moves.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]

      # vite is Medusa's, not ours: @medusajs/admin-bundler, admin-vite-plugin and types all depend on
      # `^5.4.21`, and the root pin exists to sit alongside them. A root-only vite 8 puts two vites in
      # the tree while Medusa's bundler keeps resolving 5.x — same shape as the React entries above.
      # Un-ignore when @medusajs/admin-bundler itself moves. (PR #169.)
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

      # @types/node must track the RUNTIME, and the runtime is Node 22 — `ci.yml` pins node-version 22
      # for both jobs and the Dockerfile builds and runs on node:22-slim. Typing against Node 26's
      # stdlib is the failure where tsc passes and production throws, because the types describe a Node
      # we do not run. Lift this in the same change that moves the Dockerfile and CI. (PR #171.)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is the native-port rewrite. It fails the gate today, and the toolchain around it
      # is pinned to the 5.x line (typescript-eslint ^8, Medusa's generated types). Worth doing
      # deliberately as its own piece of work — migration notes read, typescript-eslint moved in the
      # same change — never as an unattended weekly bump. 5.x minors/patches still flow. (PR #170.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep the CI/CD GitHub Actions (notify-telegram.yml) patched too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
